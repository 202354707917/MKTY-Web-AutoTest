[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers -m "not write"
markers =
    smoke: 只读冒烟测试
    ui: 浏览器 UI 自动化测试
    regression: 完整业务回归测试
    write: 有业务数据修改的测试
    readonly: 只读业务验证测试
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
