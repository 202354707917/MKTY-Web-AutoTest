name: Patient UI Readonly Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ui-readonly:
    runs-on: ubuntu-latest
    env:
      MKTY_ENABLE_WRITE_TEST: "false"
      MKTY_UI_TEST_USERNAME: ${{ secrets.MKTY_UI_TEST_USERNAME }}
      MKTY_UI_TEST_PASSWORD: ${{ secrets.MKTY_UI_TEST_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run readonly UI tests
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1440x1000x24"
          python -m pytest -m "ui and readonly"
          --alluredir=artifacts/allure-results

      - name: Upload Allure raw results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: artifacts/allure-results
          if-no-files-found: ignore
